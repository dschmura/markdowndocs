name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Configure RubyGems credentials
        run: |
          mkdir -p ~/.gem
          cat > ~/.gem/credentials << EOF
          ---
          :rubygems_api_key: ${{ secrets.RUBYGEMS_API_KEY }}
          EOF
          chmod 0600 ~/.gem/credentials

      - name: Build gem
        run: bundle exec rake build

      - name: Publish gem
        run: |
          set -euo pipefail
          GEM_FILE=$(ls pkg/markdowndocs-*.gem | head -n1)
          VERSION=$(basename "$GEM_FILE" .gem | sed 's/^markdowndocs-//')
          echo "Resolved gem version: ${VERSION}"

          # Idempotency guard: rake release already pushes from a developer
          # machine, so the version may exist on RubyGems by the time this
          # tag-triggered workflow runs. Re-pushing returns a hard error
          # ("Repushing of gem versions is not allowed"), which we don't
          # want to fail the workflow over.
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/markdowndocs/versions/${VERSION}.json")
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "::notice::markdowndocs ${VERSION} already published on RubyGems — skipping push"
            exit 0
          fi

          gem push "${GEM_FILE}"
