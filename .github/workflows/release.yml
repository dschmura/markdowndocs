name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Trusted publishing: exchanges this job's GitHub OIDC token (hence
      # id-token: write) for a short-lived RubyGems API key. No stored
      # secret, and no OTP prompt, which a long-lived key on an MFA-enabled
      # account would hit. Requires this repo and workflow to be registered
      # as a trusted publisher for markdowndocs on rubygems.org.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Build gem
        run: bundle exec rake build

      - name: Publish gem
        run: |
          set -euo pipefail
          GEM_FILE=$(ls pkg/markdowndocs-*.gem | head -n1)
          VERSION=$(basename "$GEM_FILE" .gem | sed 's/^markdowndocs-//')
          echo "Resolved gem version: ${VERSION}"

          # Idempotency guard: a version may already have been pushed by hand
          # (rake release or gem push from a developer machine) by the time
          # this tag-triggered workflow runs. Re-pushing returns a hard error
          # ("Repushing of gem versions is not allowed"), which we don't
          # want to fail the workflow over.
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/markdowndocs/versions/${VERSION}.json")
          if [ "${HTTP_CODE}" = "200" ]; then
            echo "::notice::markdowndocs ${VERSION} already published on RubyGems — skipping push"
            exit 0
          fi

          gem push "${GEM_FILE}"
